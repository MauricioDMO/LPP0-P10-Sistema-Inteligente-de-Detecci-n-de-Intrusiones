<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suricata IPS Monitor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0e1a; color: #e0e6f0; min-height: 100vh; }
    header { background: linear-gradient(135deg, #0d1321 0%, #1a2332 100%); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    header h1 span { color: #4dd4ac; }
    .header-right { display: flex; gap: 16px; align-items: center; font-size: 13px; color: #8892a8; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.ok { background: rgba(77,212,172,0.15); color: #4dd4ac; }
    .badge.err { background: rgba(255,107,107,0.15); color: #ff6b6b; }
    .badge.warn { background: rgba(255,193,7,0.15); color: #ffc107; }
    .stats-bar { display: flex; gap: 12px; padding: 12px 20px; background: rgba(13,19,33,0.6); border-bottom: 1px solid rgba(255,255,255,0.04); flex-wrap: wrap; }
    .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 10px 18px; flex: 1; min-width: 120px; text-align: center; }
    .stat-card .num { font-size: 22px; font-weight: 700; }
    .stat-card .label { font-size: 11px; color: #8892a8; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 20px; }
    .chart-box { background: rgba(13,19,33,0.6); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 14px; }
    .chart-box h3 { font-size: 13px; color: #8892a8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .chart-box canvas { max-height: 200px; }
    .map-row { padding: 0 20px 12px; }
    .map-box { background: rgba(13,19,33,0.6); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 14px; }
    .map-box h3 { font-size: 13px; color: #8892a8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    #map { height: 320px; border-radius: 8px; z-index: 0; }
    .controls { display: flex; gap: 8px; padding: 0 20px 8px; flex-wrap: wrap; align-items: center; }
    .controls button, .controls select, .controls input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #e0e6f0; padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .controls button:hover { background: rgba(77,212,172,0.15); border-color: #4dd4ac; }
    .controls button.active { background: rgba(77,212,172,0.2); border-color: #4dd4ac; color: #4dd4ac; }
    .controls input { flex: 1; min-width: 150px; }
    .controls select { cursor: pointer; }
    .export-btn { background: rgba(77,212,172,0.15) !important; border-color: #4dd4ac !important; color: #4dd4ac !important; font-weight: 600; }
    .event-table-wrap { padding: 0 20px 20px; }
    .event-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .event-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); color: #8892a8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; background: #0a0e1a; }
    .event-table td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); vertical-align: middle; }
    .event-table tr:hover { background: rgba(255,255,255,0.02); }
    .event-table .alert-row { border-left: 3px solid #ff6b6b; }
    .event-table .severity-high { color: #ff6b6b; }
    .event-table .severity-medium { color: #ffc107; }
    .event-table .severity-low { color: #4dd4ac; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .tag-alert { background: rgba(255,107,107,0.2); color: #ff6b6b; }
    .tag-dns { background: rgba(77,212,172,0.15); color: #4dd4ac; }
    .tag-http { background: rgba(77,148,255,0.15); color: #4d94ff; }
    .tag-tls { background: rgba(178,121,255,0.15); color: #b279ff; }
    .tag-flow { background: rgba(255,193,7,0.1); color: #ffc107; }
    .tag-ssh { background: rgba(255,153,0,0.15); color: #ff9900; }
    .threat-badge { display: inline-flex; align-items: center; gap: 3px; background: rgba(255,50,50,0.2); color: #ff6b6b; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; }
    .hostname { color: #8892a8; font-size: 11px; }
    .timestamp { color: #8892a8; font-size: 11px; white-space: nowrap; }
    .flag { font-size: 14px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    .dns-domain { color: #4dd4ac; font-size: 12px; }
  </style>
</head>
<body>

<header>
  <h1>🛡️ <span>Suricata</span> IPS Monitor</h1>
  <div class="header-right">
    <span id="eventCounter">0 eventos</span>
    <div class="badge ok" id="statusBadge">● Conectado</div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
  <div class="stat-card"><div class="num" id="statAlerts" style="color:#ff6b6b">0</div><div class="label">Alertas</div></div>
  <div class="stat-card"><div class="num" id="statMalicious" style="color:#ff4444">0</div><div class="label">Maliciosas</div></div>
  <div class="stat-card"><div class="num" id="statBlocked" style="color:#ffc107">0</div><div class="label">Bloqueos</div></div>
  <div class="stat-card"><div class="num" id="statDNS">0</div><div class="label">DNS</div></div>
  <div class="stat-card"><div class="num" id="statUniqueIPs">0</div><div class="label">IPs únicas</div></div>
</div>

<div class="main-grid">
  <div class="chart-box"><h3>📊 Tipos de evento</h3><canvas id="donutChart"></canvas></div>
  <div class="chart-box"><h3>📈 Eventos por minuto</h3><canvas id="barChart"></canvas></div>
</div>

<div class="map-row">
  <div class="map-box">
    <h3>🌍 Mapa de geolocalización</h3>
    <div id="map"></div>
  </div>
</div>

<div class="controls">
  <button class="active" data-filter="all">Todos</button>
  <button data-filter="alert" style="color:#ff6b6b">⚠ Alertas</button>
  <button data-filter="blocked" style="color:#ffc107">🚫 Bloqueos</button>
  <button data-filter="dns">DNS</button>
  <button data-filter="http">HTTP</button>
  <button data-filter="tls">TLS</button>
  <select id="sevFilter">
    <option value="0">Todas las severidades</option>
    <option value="1">🔴 Crítica (1)</option>
    <option value="2">🟠 Alta (2)</option>
    <option value="3">🟡 Media (3)</option>
    <option value="4">🟢 Baja (4)</option>
  </select>
  <input id="searchInput" placeholder="🔍 Buscar en eventos..." />
  <button class="export-btn" id="exportBtn">⬇ CSV</button>
  <button id="clearBtn" style="color:#ff6b6b">🗑 Limpiar</button>
</div>

<div class="event-table-wrap">
  <table class="event-table">
    <thead><tr>
      <th>Tipo</th><th>Tiempo</th><th>Origen</th><th>Destino</th><th>Mensaje / Dominio</th><th>Threat</th>
    </tr></thead>
    <tbody id="eventBody"></tbody>
  </table>
</div>

<script>
const RELEVANT_TYPES = new Set(['alert','dns','http','tls','ssh','ftp','smtp','flow']);
let allEvents = [];
let filterType = 'all';
let filterSev = 0;
let filterSearch = '';
let map = null;
let mapMarkers = [];
const seenLocationKeys = new Set();

const donutCtx = document.getElementById('donutChart').getContext('2d');
const donutChart = new Chart(donutCtx, {
  type: 'doughnut',
  data: { labels: [], datasets: [{ data: [], backgroundColor: ['#ff6b6b','#4dd4ac','#4d94ff','#b279ff','#ffc107','#ff9900','#8892a8'], borderWidth: 0 }] },
  options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { color: '#8892a8', font: { size: 11 } } } } }
});

const barCtx = document.getElementById('barChart').getContext('2d');
const barChart = new Chart(barCtx, {
  type: 'bar',
  data: { labels: [], datasets: [{ label: 'Eventos', data: [], backgroundColor: '#4dd4ac', borderRadius: 4 }] },
  options: { responsive: true, maintainAspectRatio: true, scales: { x: { ticks: { color: '#8892a8', font: { size: 10 } }, grid: { display: false } }, y: { beginAtZero: true, ticks: { color: '#8892a8', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' } } }, plugins: { legend: { display: false } } }
});

function getWsUrl() {
  const p = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
  return p + window.location.host + '/ws';
}

let ws = null;
function connect() {
  try { ws = new WebSocket(getWsUrl()); } catch(e) { setTimeout(connect, 3000); return; }
  ws.onopen = () => { document.getElementById('statusBadge').className = 'badge ok'; document.getElementById('statusBadge').textContent = '● Conectado'; };
  ws.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'pong') return;
      addEvent(d);
    } catch(err) {}
  };
  ws.onclose = () => { document.getElementById('statusBadge').className = 'badge err'; document.getElementById('statusBadge').textContent = '● Desconectado'; setTimeout(connect, 3000); };
  ws.onerror = () => { document.getElementById('statusBadge').className = 'badge warn'; document.getElementById('statusBadge').textContent = '● Error'; };
}

function getEventType(evt) {
  return (evt?.suricata?.eve?.event_type || evt?.event_type || '').toLowerCase();
}

function getSrcIP(evt) { return evt?.source?.ip || evt?.src_ip || ''; }
function getDstIP(evt) { return evt?.destination?.ip || evt?.dest_ip || ''; }

function isBlocked(evt) {
  const sig = evt?.suricata?.eve?.alert?.signature || evt?.alert?.signature || '';
  return sig.toLowerCase().includes('bloqueo');
}

function getSeverity(evt) {
  return evt?.suricata?.eve?.alert?.severity || evt?.alert?.severity || 0;
}

function getMessage(evt) {
  const et = getEventType(evt);
  const eve = evt?.suricata?.eve || evt;
  if (et === 'alert') return eve?.alert?.signature || 'Alerta';
  if (et === 'dns') {
    const q = eve?.dns?.queries;
    if (q && q[0]?.rrname) return 'DNS: ' + q[0].rrname;
    return 'DNS Query';
  }
  if (et === 'http') return eve?.http?.hostname || eve?.http?.url || 'HTTP';
  if (et === 'tls') return eve?.tls?.sni || 'TLS';
  if (et === 'ssh') return eve?.ssh?.client?.software_version || 'SSH';
  return et;
}

function getTimestamp(evt) {
  const ts = evt?.timestamp || evt?.['@timestamp'] || '';
  try { return new Date(ts).toLocaleTimeString(); } catch(e) { return ''; }
}

function addEvent(evt) {
  const et = getEventType(evt);
  if (et === 'stats' || et === 'pcap') return;
  allEvents.unshift(evt);
  if (allEvents.length > 500) allEvents.pop();

  updateStats();
  updateDonut();
  updateBar();
  updateMap(evt);
  renderTable();
}

function updateStats() {
  let total = 0, alerts = 0, mal = 0, blocked = 0, dns = 0, ips = new Set();
  for (const evt of allEvents) {
    const et = getEventType(evt);
    if (!RELEVANT_TYPES.has(et) && !(et === 'flow' && evt?.suricata?.eve?.flow?.alerted)) continue;
    total++;
    if (et === 'alert') { alerts++; if (isBlocked(evt)) blocked++; }
    if (et === 'dns') dns++;
    if (evt?._threat?.is_malicious) mal++;
    const s = getSrcIP(evt); if (s) ips.add(s);
    const d = getDstIP(evt); if (d) ips.add(d);
  }
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statAlerts').textContent = alerts;
  document.getElementById('statMalicious').textContent = mal;
  document.getElementById('statBlocked').textContent = blocked;
  document.getElementById('statDNS').textContent = dns;
  document.getElementById('statUniqueIPs').textContent = ips.size;
  document.getElementById('eventCounter').textContent = total + ' eventos';
}

function updateDonut() {
  const counts = {};
  for (const evt of allEvents) {
    const et = getEventType(evt);
    if (et) counts[et] = (counts[et] || 0) + 1;
  }
  const keys = Object.keys(counts);
  donutChart.data.labels = keys;
  donutChart.data.datasets[0].data = keys.map(k => counts[k]);
  donutChart.update();
}

function updateBar() {
  const now = Date.now();
  const buckets = {};
  for (let i = 9; i >= 0; i--) {
    const t = new Date(now - i * 60000);
    buckets[t.getMinutes()] = 0;
  }
  for (const evt of allEvents) {
    const ts = evt?.timestamp || evt?.['@timestamp'];
    if (!ts) continue;
    try {
      const d = new Date(ts);
      const m = d.getMinutes();
      if (m in buckets) buckets[m]++;
    } catch(e) {}
  }
  const labels = Object.keys(buckets).map(m => ':' + String(m).padStart(2, '0'));
  barChart.data.labels = labels;
  barChart.data.datasets[0].data = Object.values(buckets);
  barChart.update();
}

function initMap() {
  map = L.map('map', { zoomControl: true, attributionControl: false }).setView([15, -10], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
}

function updateMap(evt) {
  const geo = evt?._geo;
  if (!geo) return;
  for (const key of ['source', 'destination']) {
    const g = geo[key];
    if (!g || !g.lat || !g.lon) continue;
    const locKey = g.lat.toFixed(1) + ',' + g.lon.toFixed(1);
    if (seenLocationKeys.has(locKey)) continue;
    seenLocationKeys.add(locKey);

    const ip = key === 'source' ? getSrcIP(evt) : getDstIP(evt);
    const threat = evt?._threat;
    const isMal = threat?.is_malicious;

    const popupContent = `
      <div style="font-family:system-ui;font-size:13px;min-width:180px">
        <b>${ip}</b><br>
        ${g.country ? '🌍 ' + g.country + (g.city ? ', ' + g.city : '') : ''}<br>
        ${g.isp ? '🏢 ' + g.isp : ''}
        ${isMal ? '<br><span style="color:#ff4444;font-weight:700">☠️ MALICIOSA</span>' : ''}
      </div>`;

    const color = isMal ? '#ff4444' : '#4dd4ac';
    const marker = L.circleMarker([g.lat, g.lon], {
      radius: 7, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.8
    }).addTo(map);
    marker.bindPopup(popupContent);
    mapMarkers.push(marker);
  }
}

function matchesFilter(evt) {
  const et = getEventType(evt);
  if (filterType === 'alert' && et !== 'alert') return false;
  if (filterType === 'blocked' && (!isBlocked(evt) || et !== 'alert')) return false;
  if (filterType === 'dns' && et !== 'dns') return false;
  if (filterType === 'http' && et !== 'http') return false;
  if (filterType === 'tls' && et !== 'tls') return false;
  if (filterSev > 0 && getSeverity(evt) !== filterSev) return false;
  if (filterSearch) {
    const s = filterSearch.toLowerCase();
    const msg = getMessage(evt).toLowerCase();
    const src = getSrcIP(evt).toLowerCase();
    const dst = getDstIP(evt).toLowerCase();
    if (!msg.includes(s) && !src.includes(s) && !dst.includes(s)) return false;
  }
  return true;
}

function renderTable() {
  const tbody = document.getElementById('eventBody');
  let html = '';
  let count = 0;
  for (const evt of allEvents) {
    if (!matchesFilter(evt)) continue;
    if (count >= 100) break;
    count++;

    const et = getEventType(evt);
    const ts = getTimestamp(evt);
    const src = getSrcIP(evt);
    const dst = getDstIP(evt);
    const msg = getMessage(evt);
    const sev = getSeverity(evt);
    const isMal = evt?._threat?.is_malicious;
    const conf = evt?._threat?.confidence || 0;
    const reports = evt?._threat?.total_reports || 0;
    const srcHost = evt?._resolved?.source_hostname;
    const dstHost = evt?._resolved?.dest_hostname;
    const srcGeo = evt?._geo?.source;
    const dstGeo = evt?._geo?.destination;

    const tagClass = 'tag-' + (et === 'alert' ? 'alert' : et);
    const rowClass = et === 'alert' ? 'alert-row' : '';
    const sevClass = sev === 1 || sev === 2 ? 'severity-high' : sev === 3 ? 'severity-medium' : sev === 4 ? 'severity-low' : '';

    const srcDisplay = src
      + (srcHost ? ` <span class="hostname">(${srcHost})</span>` : '')
      + (srcGeo?.country_code ? ` <span class="flag">${getFlagEmoji(srcGeo.country_code)}</span>` : '');

    const dstDisplay = dst
      + (dstHost ? ` <span class="hostname">(${dstHost})</span>` : '')
      + (dstGeo?.country_code ? ` <span class="flag">${getFlagEmoji(dstGeo.country_code)}</span>` : '');

    const threatBadge = isMal
      ? `<span class="threat-badge">☠️ ${conf}% (${reports})</span>`
      : '';

    const isDnsDomain = et === 'dns' && msg.startsWith('DNS:');
    const msgDisplay = isDnsDomain ? `<span class="dns-domain">${msg}</span>` : msg;

    html += `<tr class="${rowClass}">
      <td><span class="tag ${tagClass}">${et.toUpperCase()}</span></td>
      <td class="timestamp">${ts}</td>
      <td>${srcDisplay}</td>
      <td>${dstDisplay}</td>
      <td>${msgDisplay}</td>
      <td>${threatBadge}</td>
    </tr>`;
  }
  tbody.innerHTML = html || '<tr><td colspan="6" style="text-align:center;color:#8892a8;padding:20px">Sin eventos que coincidan</td></tr>';
}

function getFlagEmoji(code) {
  if (!code || code.length !== 2) return '';
  const offset = 0x1F1E6 - 65;
  return String.fromCodePoint(code.charCodeAt(0) + offset, code.charCodeAt(1) + offset);
}

// Controls
document.querySelectorAll('.controls button[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.controls button[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterType = btn.dataset.filter;
    renderTable();
  });
});

document.getElementById('sevFilter').addEventListener('change', (e) => {
  filterSev = parseInt(e.target.value);
  renderTable();
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  filterSearch = e.target.value;
  renderTable();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  allEvents = [];
  seenLocationKeys.clear();
  if (map) { map.eachLayer(l => { if (l instanceof L.CircleMarker) map.removeLayer(l); }); }
  mapMarkers = [];
  updateStats();
  updateDonut();
  updateBar();
  renderTable();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const filtered = allEvents.filter(matchesFilter);
  const header = 'Tipo,Tiempo,Origen,Destino,Mensaje,Severidad,Maliciosa,Confianza,Reportes,País Origen,País Destino\n';
  const rows = filtered.map(evt => {
    const et = getEventType(evt);
    const ts = getTimestamp(evt);
    const src = getSrcIP(evt);
    const dst = getDstIP(evt);
    const msg = getMessage(evt).replace(/"/g, '""');
    const sev = getSeverity(evt);
    const isMal = evt?._threat?.is_malicious || false;
    const conf = evt?._threat?.confidence || 0;
    const rep = evt?._threat?.total_reports || 0;
    const srcC = evt?._geo?.source?.country || '';
    const dstC = evt?._geo?.destination?.country || '';
    return `"${et}","${ts}","${src}","${dst}","${msg}",${sev},${isMal},${conf},${rep},"${srcC}","${dstC}"`;
  }).join('\n');
  const blob = new Blob(['\uFEFF' + header + rows], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'suricata_export_' + new Date().toISOString().slice(0, 19) + '.csv';
  a.click();
});

// Init
initMap();
connect();
</script>

</body>
</html>
