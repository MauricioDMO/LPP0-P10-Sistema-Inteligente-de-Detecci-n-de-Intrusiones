<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suricata Frontend - Eventos en Tiempo Real</title>
  <style>
    :root {
      --bg: #0b1020;
      --surface: #11192e;
      --surface-2: #0f172a;
      --text: #e5eefc;
      --muted: #92a4c5;
      --accent: #4dd4ac;
      --accent-2: #7aa2ff;
      --danger: #ff6b6b;
      --warning: #f7c948;
      --line: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(77, 212, 172, 0.15), transparent 35%),
        radial-gradient(circle at bottom right, rgba(122, 162, 255, 0.12), transparent 40%),
        linear-gradient(180deg, #08101f 0%, #0b1020 100%);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      background: rgba(17, 25, 46, 0.6);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .badge {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(77, 212, 172, 0.16);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge.disconnected {
      background: rgba(255, 107, 107, 0.16);
      color: var(--danger);
    }

    .content {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
    }

    .panel {
      background: rgba(17, 25, 46, 0.7);
      border: 1px solid var(--line);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .filter-group {
      margin-bottom: 16px;
    }

    .filter-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .filter-group select,
    .filter-group input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
    }

    .filter-group select:focus,
    .filter-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(77, 212, 172, 0.2);
    }

    .filter-group textarea {
      font-family: monospace;
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.02);
    }

    button:active {
      transform: scale(0.98);
    }

    .event-feed {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .event {
      margin-bottom: 8px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      font-size: 0.85rem;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .event.alert {
      background: rgba(255, 107, 107, 0.08);
      border-color: rgba(255, 107, 107, 0.3);
    }

    .event-tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      margin-right: 4px;
    }

    .event-tag.alert { background: rgba(255, 107, 107, 0.3); color: var(--danger); }
    .event-tag.http { background: rgba(122, 162, 255, 0.3); color: var(--accent-2); }
    .event-tag.dns { background: rgba(247, 201, 72, 0.3); color: var(--warning); }
    .event-tag.flow { background: rgba(77, 212, 172, 0.3); color: var(--accent); }

    .event-time {
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 6px;
    }

    .event-summary {
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .event-detail {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-right {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat-card {
      padding: 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      margin: 8px 0;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .controls {
      padding: 12px;
      background: rgba(255,255,255,0.02);
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
    }

    .btn-small {
      flex: 1;
      padding: 8px 12px;
      background: rgba(77, 212, 172, 0.16);
      border: 1px solid rgba(77, 212, 172, 0.3);
      color: var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-small:hover {
      background: rgba(77, 212, 172, 0.25);
    }

    .panel-content::-webkit-scrollbar {
      width: 6px;
    }

    .panel-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .panel-content::-webkit-scrollbar-thumb {
      background: rgba(77, 212, 172, 0.3);
      border-radius: 3px;
    }

    .no-events {
      color: var(--muted);
      text-align: center;
      padding: 32px 16px;
      font-size: 0.9rem;
    }

    .info-message {
      padding: 12px;
      border-radius: 8px;
      background: rgba(122, 162, 255, 0.1);
      border: 1px solid rgba(122, 162, 255, 0.3);
      color: var(--accent-2);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="pulse"></div>
      Suricata Monitor
    </div>
    <div class="status">
      <span>Estado:</span>
      <span class="badge" id="status">Conectando...</span>
    </div>
  </header>

  <div class="content">
    <!-- Sidebar izquierdo: Filtros -->
    <div class="panel">
      <div class="panel-header">⚙️ Filtros</div>
      <div class="panel-content">
        <div class="info-message">
          Ajusta los filtros y haz clic en "Aplicar" para actualizar la vista.
        </div>

        <div class="filter-group">
          <label>Tipos de eventos</label>
          <select id="eventTypes" multiple size="5">
            <option value="ALERT" selected>Alertas</option>
            <option value="HTTP">HTTP</option>
            <option value="DNS">DNS</option>
            <option value="SSH">SSH</option>
            <option value="TLS">TLS</option>
            <option value="FTP">FTP</option>
            <option value="FLOW">Flow</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Severidad mínima</label>
          <select id="severity">
            <option value="">Todas</option>
            <option value="1">🔴 Critical</option>
            <option value="2">🟠 High</option>
            <option value="3">🟡 Medium</option>
            <option value="4">🟢 Low</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Palabras clave (una por línea)</label>
          <textarea id="keywords" placeholder="ssh&#10;brute&#10;force"></textarea>
        </div>

        <button onclick="applyFilter()">Aplicar Filtro</button>
      </div>
      <div class="controls">
        <button class="btn-small" onclick="clearEvents()">Limpiar</button>
        <button class="btn-small" onclick="testEvent()">Evento Prueba</button>
      </div>
    </div>

    <!-- Centro: Feed de eventos -->
    <div class="panel event-feed">
      <div class="panel-header">📡 Eventos en tiempo real</div>
      <div class="panel-content" id="eventList">
        <div class="no-events">Esperando eventos...</div>
      </div>
    </div>

    <!-- Sidebar derecho: Estadísticas -->
    <div class="sidebar-right">
      <div class="panel">
        <div class="panel-header">📊 Estadísticas</div>
        <div class="panel-content">
          <div class="stat-card">
            <div class="stat-label">Total hoy</div>
            <div class="stat-value" id="totalEvents">0</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Alertas</div>
            <div class="stat-value" id="alertCount">0</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Eventos/min</div>
            <div class="stat-value" id="eventsPerMin">0</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Últimas 5min</div>
            <div class="stat-value" id="lastFiveMin">0</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">🌍 IPs Top</div>
        <div class="panel-content" id="topIps">
          <div class="no-events">Sin datos</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let events = [];
    const MAX_EVENTS = 100;
    let stats = {
      total: 0,
      alerts: 0,
      timestamps: [],
      ips: {},
    };

    function connect() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const host = window.location.host || "localhost:8000";
      ws = new WebSocket(`${protocol}//${host}/ws`);

      ws.onopen = () => {
        updateStatus("Conectado", false);
        console.log("✓ Conectado al WebSocket");
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "pong") {
          console.log("Pong recibido");
        } else {
          // Es un evento de Suricata
          addEvent(data);
        }
      };

      ws.onerror = (error) => {
        updateStatus("Error de conexión", true);
        console.error("WebSocket error:", error);
      };

      ws.onclose = () => {
        updateStatus("Desconectado", true);
        console.log("Desconectado del WebSocket");
        // Intentar reconectar cada 3 segundos
        setTimeout(connect, 3000);
      };
    }

    function updateStatus(text, disconnected) {
      const badge = document.getElementById("status");
      badge.textContent = text;
      badge.classList.toggle("disconnected", disconnected);
    }

    function addEvent(eventData) {
      events.unshift(eventData);
      if (events.length > MAX_EVENTS) events.pop();

      stats.total++;
      if (eventData.event_type === "alert") stats.alerts++;

      // Registrar timestamp para cálculo de eventos por minuto
      stats.timestamps.push(Date.now());
      stats.timestamps = stats.timestamps.filter(t => Date.now() - t < 60000);

      // Contar IPs
      const ip = eventData.src_ip || "unknown";
      stats.ips[ip] = (stats.ips[ip] || 0) + 1;

      renderEvents();
      updateStats();
    }

    function renderEvents() {
      const list = document.getElementById("eventList");
      
      if (events.length === 0) {
        list.innerHTML = '<div class="no-events">Esperando eventos...</div>';
        return;
      }

      list.innerHTML = events
        .map((evt) => {
          const isAlert = evt.event_type === "alert";
          const time = new Date(evt.timestamp || Date.now()).toLocaleTimeString();
          
          return `
            <div class="event ${isAlert ? "alert" : ""}">
              <span class="event-tag ${evt.event_type}">${evt.event_type.toUpperCase()}</span>
              <div class="event-time">${time}</div>
              <div class="event-summary">${evt.message || evt.alert?.signature || "Sin mensaje"}</div>
              <div class="event-detail">${evt.src_ip || ""} → ${evt.dest_ip || ""}</div>
            </div>
          `;
        })
        .join("");
    }

    function updateStats() {
      document.getElementById("totalEvents").textContent = stats.total;
      document.getElementById("alertCount").textContent = stats.alerts;
      document.getElementById("eventsPerMin").textContent = stats.timestamps.length;

      // Top IPs
      const topIps = Object.entries(stats.ips)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      const ipsHtml = topIps
        .map(([ip, count]) => `<div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem;"><span>${ip}</span><span style="color: var(--accent);">${count}</span></div>`)
        .join("");

      document.getElementById("topIps").innerHTML = ipsHtml || '<div class="no-events">Sin datos</div>';
    }

    function applyFilter() {
      const eventTypes = Array.from(document.getElementById("eventTypes").selectedOptions).map(o => o.value);
      const severity = document.getElementById("severity").value || null;
      const keywords = document.getElementById("keywords").value.split("\n").filter(k => k.trim());

      const filterCmd = {
        type: "filter",
        event_types: eventTypes,
        min_severity: severity ? parseInt(severity) : null,
        keywords: keywords,
      };

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(filterCmd));
        console.log("Filtro aplicado:", filterCmd);
      }
    }

    function clearEvents() {
      events = [];
      stats = { total: 0, alerts: 0, timestamps: [], ips: {} };
      renderEvents();
      updateStats();
    }

    function testEvent() {
      // Simular un evento de prueba
      addEvent({
        event_type: "alert",
        message: "🧪 Evento de prueba",
        src_ip: "192.168.1." + Math.floor(Math.random() * 255),
        dest_ip: "192.168.1.10",
        timestamp: new Date().toISOString(),
      });
    }

    // Conectar al cargar la página
    connect();

    // Enviar ping cada 30 segundos para mantener la conexión
    setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "ping" }));
      }
    }, 30000);
  </script>
</body>
</html>
