<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suricata Frontend - Eventos en Tiempo Real (fix)</title>
  <style>/* minimal same styles omitted for brevity */
  body{font-family:system-ui;background:#08101f;color:#e5eefc}
  .badge{padding:6px 12px;border-radius:999px;background:rgba(77,212,172,0.16);color:#4dd4ac}
  .badge.disconnected{background:rgba(255,107,107,0.16);color:#ff6b6b}
  .panel{background:rgba(17,25,46,0.7);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.08)}
  .event{padding:8px;margin-bottom:8px;border-radius:8px;background:rgba(255,255,255,0.02)}
  </style>
</head>
<body>
    <header style="padding:12px;display:flex;justify-content:space-between;align-items:center">
    <div style="font-weight:700">Suricata Monitor (fix)</div>
    <div style="display:flex;gap:12px;align-items:center">
      <div class="badge" id="status">Conectando...</div>
      <div id="debugPanel" style="font-size:12px;color:#92a4c5">WS: <span id="wsUrlDisplay" style="font-family:monospace"></span> · <span id="lastLog">esperando...</span></div>
    </div>
  </header>

  <main style="display:flex;gap:12px;padding:12px">
    <section style="flex:1">
      <div class="panel">
        <h3>Eventos en tiempo real</h3>
        <div id="eventList"><div style="color:#92a4c5">Esperando eventos...</div></div>
      </div>
    </section>
  </main>

  <script>
    // Fix: use current hostname but force backend port 8000 for WS
    const hostname = window.location.hostname;
    const backendHost = hostname + ':8000';
    const wsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + backendHost + '/ws';

    let ws = null;
    function updateStatus(text, disconnected=false){
      const b = document.getElementById('status'); b.textContent = text; b.classList.toggle('disconnected', disconnected);
    }

    function connect(){
      console.log('WS connecting to', wsUrl);
      document.getElementById('wsUrlDisplay').textContent = wsUrl;
      try{
        ws = new WebSocket(wsUrl);
      }catch(err){
        console.error('WS constructor error', err);
        updateStatus('Error de creación WS', true);
        setTimeout(connect,3000);
        return;
      }

      ws.onopen = (ev) => { console.log('WS open', ev); updateStatus('Conectado', false); document.getElementById('lastLog').textContent = 'open'; };
      ws.onmessage = (e) => {
        console.log('WS message', e.data);
        try{
          const data = JSON.parse(e.data);
          if(data.type==='pong') return;
          renderEvent(data);
        }catch(err){ console.error('msg parse', err); }
      };
      ws.onerror = (ev)=> { console.error('WS error', ev); updateStatus('Error de conexión', true); document.getElementById('lastLog').textContent = 'error'; };
      ws.onclose = (ev)=> { console.warn('WS closed', ev); updateStatus('Desconectado', true); document.getElementById('lastLog').textContent = 'closed'; setTimeout(connect,3000); };
    }

    function renderEvent(evt){
      const list = document.getElementById('eventList');
      const el = document.createElement('div'); el.className='event';
      const t = new Date(evt.timestamp||Date.now()).toLocaleTimeString();
      el.innerHTML = `<div style="font-weight:700">${evt.event_type||'event'} <small style='color:#92a4c5'>${t}</small></div>
                      <div style='color:#cfefff'>${evt.message||evt.alert?.signature||'Sin mensaje'}</div>
                      <div style='color:#92a4c5;font-family:monospace'>${evt.src_ip||''} → ${evt.dest_ip||''}</div>`;
      list.prepend(el);
    }

    connect();
  </script>
</body>
</html>
