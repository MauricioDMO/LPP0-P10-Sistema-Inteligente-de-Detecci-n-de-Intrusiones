services:
  elasticsearch:
    build:
      context: ./elasticsearch
      args:
        STACK_VERSION: ${STACK_VERSION}
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      network.host: 0.0.0.0
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - eslogs:/usr/share/elasticsearch/logs
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: always

  elasticsearch-setup:
    image: curlimages/curl:8.10.1
    container_name: elasticsearch-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./elasticsearch/ilm:/setup/ilm:ro
      - ./elasticsearch/templates:/setup/templates:ro
      - ./elasticsearch/scripts/apply-index-management.sh:/setup/apply-index-management.sh:ro
    entrypoint: [ "sh" ]
    command: [ "/setup/apply-index-management.sh" ]
    restart: "no"

  suricata:
    build:
      context: ./suricata
    container_name: suricata
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      SURICATA_MODE: ${SURICATA_MODE}
      SURICATA_INTERFACE: ${SURICATA_INTERFACE}
    volumes:
      - ./suricata/config/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/config/classification.config:/etc/suricata/classification.config:ro
      - ./suricata/config/reference.config:/etc/suricata/reference.config:ro
      - ./suricata/config/threshold.config:/etc/suricata/threshold.config:ro
      - ./suricata/config/rules:/var/lib/suricata/rules:ro
      - suricata-logs:/var/log/suricata
    restart: always

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suricata}
      POSTGRES_USER: ${POSTGRES_USER:-suricata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suricata}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  logstash:
    build:
      context: ./logstash
      args:
        STACK_VERSION: ${STACK_VERSION}
    container_name: logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
    restart: always

  filebeat:
    build:
      context: ./filebeat
      args:
        STACK_VERSION: ${STACK_VERSION}
    container_name: filebeat
    user: root
    depends_on:
      logstash:
        condition: service_started
      suricata:
        condition: service_started
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./filebeat/modules.d:/usr/share/filebeat/modules.d:ro
      - suricata-logs:/var/log/suricata:ro
      - filebeat-data:/usr/share/filebeat/data
    command: [ "filebeat", "-e", "--strict.perms=false" ]
    restart: always

  backend:
    build:
      context: ./backend
    container_name: backend
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BACKEND_REDIS_HOST: redis
      BACKEND_REDIS_PORT: 6379
      BACKEND_REDIS_DB: 0
      BACKEND_REDIS_CHANNEL: suricata
      BACKEND_ELASTICSEARCH_HOST: elasticsearch
      BACKEND_ELASTICSEARCH_PORT: 9200
      BACKEND_ELASTICSEARCH_SCHEME: http
      BACKEND_ELASTICSEARCH_INDEX: suricata-*
      BACKEND_ELASTICSEARCH_ENRICHED_INDEX: ${BACKEND_ELASTICSEARCH_ENRICHED_INDEX:-suricata-enriched-*}
      BACKEND_ELASTICSEARCH_ENRICHED_WRITE_INDEX: ${BACKEND_ELASTICSEARCH_ENRICHED_WRITE_INDEX:-suricata-enriched}
      BACKEND_ENRICHED_INDEX_ENABLED: ${BACKEND_ENRICHED_INDEX_ENABLED:-true}
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql+asyncpg://suricata:suricata@postgres:5432/suricata}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-change-me}
      BACKEND_JWT_ALGORITHM: ${BACKEND_JWT_ALGORITHM:-HS256}
      BACKEND_JWT_EXPIRES_MINUTES: ${BACKEND_JWT_EXPIRES_MINUTES:-480}
      BACKEND_CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      BACKEND_INITIAL_ADMIN_USERNAME: ${BACKEND_INITIAL_ADMIN_USERNAME:-admin}
      BACKEND_INITIAL_ADMIN_PASSWORD: ${BACKEND_INITIAL_ADMIN_PASSWORD:-admin123}
      BACKEND_INITIAL_ADMIN_EMAIL: ${BACKEND_INITIAL_ADMIN_EMAIL:-admin@local}
      BACKEND_API_HOST: 0.0.0.0
      BACKEND_API_PORT: 8000
      BACKEND_API_TITLE: Suricata Backend API
      BACKEND_API_VERSION: 1.0.0
      BACKEND_TELEGRAM_BOT_TOKEN: ${BACKEND_TELEGRAM_BOT_TOKEN:-}
      BACKEND_TELEGRAM_CHAT_ID: ${BACKEND_TELEGRAM_CHAT_ID:-}
      BACKEND_ABUSEIPDB_KEY: ${BACKEND_ABUSEIPDB_KEY:-}
      BACKEND_GEOIP_DB_PATH: ${BACKEND_GEOIP_DB_PATH:-/data/GeoLite2-City.mmdb}
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    container_name: frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    restart: always

volumes:
  esdata:
  eslogs:
  filebeat-data:
  suricata-logs:
  postgres-data:
