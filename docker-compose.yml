services:
  elasticsearch:
    build:
      context: ./elasticsearch
      args:
        STACK_VERSION: ${STACK_VERSION}
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      network.host: 0.0.0.0
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - eslogs:/usr/share/elasticsearch/logs
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped


  suricata:
    build:
      context: ./suricata
    container_name: suricata
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      SURICATA_MODE: ${SURICATA_MODE}
      SURICATA_INTERFACE: ${SURICATA_INTERFACE}
    volumes:
      - ./suricata/config/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/config/classification.config:/etc/suricata/classification.config:ro
      - ./suricata/config/reference.config:/etc/suricata/reference.config:ro
      - ./suricata/config/threshold.config:/etc/suricata/threshold.config:ro
      - ./suricata/config/rules:/var/lib/suricata/rules:ro
      - suricata-logs:/var/log/suricata
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  logstash:
    build:
      context: ./logstash
      args:
        STACK_VERSION: ${STACK_VERSION}
    container_name: logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
    restart: unless-stopped

  filebeat:
    build:
      context: ./filebeat
      args:
        STACK_VERSION: ${STACK_VERSION}
    container_name: filebeat
    user: root
    depends_on:
      logstash:
        condition: service_started
      suricata:
        condition: service_started
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./filebeat/modules.d:/usr/share/filebeat/modules.d:ro
      - suricata-logs:/var/log/suricata:ro
      - filebeat-data:/usr/share/filebeat/data
    command: [ "filebeat", "-e", "--strict.perms=false" ]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: backend
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      BACKEND_REDIS_HOST: redis
      BACKEND_REDIS_PORT: 6379
      BACKEND_REDIS_DB: 0
      BACKEND_REDIS_CHANNEL: suricata
      BACKEND_ELASTICSEARCH_HOST: elasticsearch
      BACKEND_ELASTICSEARCH_PORT: 9200
      BACKEND_ELASTICSEARCH_SCHEME: http
      BACKEND_ELASTICSEARCH_INDEX: suricata-*
      BACKEND_API_HOST: 0.0.0.0
      BACKEND_API_PORT: 8000
      BACKEND_API_TITLE: Suricata Backend API
      BACKEND_API_VERSION: 1.0.0
      BACKEND_TELEGRAM_BOT_TOKEN: 8672110233:AAE0BTT_hrZD6ZFPaNsg5TE3LS3UkNyUGol
      BACKEND_TELEGRAM_CHAT_ID: 6427506351
      BACKEND_ABUSEIPDB_KEY: 5ad0e77ee2a865ee36f063c0ce28fdf7ba7de6d2e30246b8cf1c91002a2336d00bcf16cdb2b0e765
    restart: unless-stopped

volumes:
  esdata:
  eslogs:
  filebeat-data:
  suricata-logs:
